<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei" data-pptx-page-role="ending">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F6F2"/>

  <g id="page-kicker" data-pptx-bounds="60 30 1160 36">
    <rect x="60" y="40" width="28" height="3" fill="#0F766E"/>
    <text x="100" y="50" font-size="14" font-weight="bold" fill="#8FA0AC" letter-spacing="1">EP001 · CONTEXT ENGINEERING</text>
    <line x1="60" y1="62" x2="1220" y2="62" stroke="#DDD9CE" stroke-width="1"/>
  </g>

  <g id="page-title" data-pptx-bounds="60 76 1160 60">
    <text x="60" y="118" font-size="40" font-weight="bold" fill="#1A1D1F">Context Engineering = Compile,not Append</text>
  </g>

  <g id="append-block" data-pptx-bounds="60 160 520 244">
    <rect x="60" y="168" width="520" height="228" rx="8" fill="#ECEAE2" stroke="#C9C5B8" stroke-width="1"/>
    <text x="92" y="210" font-size="16" font-weight="bold" fill="#6B7280" letter-spacing="1">APPEND — 一味追加</text>
    <text x="92" y="262" font-size="20" font-family="Consolas" fill="#5B6472">Context = Append(</text>
    <text x="124" y="296" font-size="20" font-family="Consolas" fill="#5B6472">History,</text>
    <text x="124" y="330" font-size="20" font-family="Consolas" fill="#5B6472">New_Message</text>
    <text x="92" y="364" font-size="20" font-family="Consolas" fill="#5B6472">)</text>
    <line x1="500" y1="188" x2="556" y2="244" stroke="#B91C1C" stroke-width="3"/>
    <line x1="556" y1="188" x2="500" y2="244" stroke="#B91C1C" stroke-width="3"/>
  </g>

  <g id="compile-block" data-pptx-bounds="700 160 520 244">
    <rect x="700" y="168" width="520" height="228" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <text x="732" y="210" font-size="16" font-weight="bold" fill="#0F766E" letter-spacing="1">COMPILE — 按本轮决策编译</text>
    <text x="732" y="258" font-size="20" font-family="Consolas" fill="#1A1D1F">Context = Compile(</text>
    <text x="764" y="290" font-size="20" font-family="Consolas" fill="#1A1D1F">Constraints,</text>
    <text x="764" y="322" font-size="20" font-family="Consolas" fill="#1A1D1F">Task_State,  Evidence,</text>
    <text x="764" y="354" font-size="20" font-family="Consolas" fill="#1A1D1F">Tools</text>
    <text x="732" y="386" font-size="20" font-family="Consolas" fill="#1A1D1F">)</text>
  </g>

  <g id="final-statement" data-pptx-bounds="60 448 1160 170">
    <rect x="60" y="462" width="4" height="120" fill="#0F766E"/>
    <text x="88" y="496" font-size="30" font-family="SimSun" font-weight="bold" fill="#1A1D1F">Context Engineering ≠ 塞入更多信息。</text>
    <text x="88" y="542" font-size="18" fill="#3A4148">它是在有限预算、权限和可靠性约束下,把当前决策真正需要的信息,<tspan x="88" dy="34">编译成模型这一轮能够使用的 Working Set。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-bounds="1120 668 100 32">
    <text x="1220" y="690" font-size="14" fill="#98A1AB" text-anchor="end">13 / 13</text>
  </g>
</svg>
