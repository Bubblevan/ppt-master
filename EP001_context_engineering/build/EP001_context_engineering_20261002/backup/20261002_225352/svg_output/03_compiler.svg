  <g id="compiler" data-pptx-bounds="378 150 448 480">
    <rect x="396" y="196" width="364" height="380" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <text x="578" y="232" font-size="14" font-weight="bold" fill="#0F766E" letter-spacing="1" text-anchor="middle">CONTEXT COMPILER</text>
    <g id="compiler-step-filter">
      <rect x="420" y="252" width="316" height="46" rx="4" fill="#F0EEE7"/>
      <text x="436" y="281" font-size="16" fill="#1A1D1F"><tspan font-family="Consolas" fill="#0F766E">01</tspan> FILTER — 筛掉无关与无权材料</text>
    </g>
    <g id="compiler-step-rank">
      <rect x="420" y="314" width="316" height="46" rx="4" fill="#F0EEE7"/>
      <text x="436" y="343" font-size="16" fill="#1A1D1F"><tspan font-family="Consolas" fill="#0F766E">02</tspan> RANK — 按相关度与权威排序</text>
    </g>
    <g id="compiler-step-budget">
      <rect x="420" y="376" width="316" height="46" rx="4" fill="#F0EEE7"/>
      <text x="436" y="405" font-size="16" fill="#1A1D1F"><tspan font-family="Consolas" fill="#0F766E">03</tspan> BUDGET — 在 token 预算内取舍</text>
    </g>
    <g id="compiler-step-assemble">
      <rect x="420" y="438" width="316" height="46" rx="4" fill="#F0EEE7"/>
      <text x="436" y="467" font-size="16" fill="#1A1D1F"><tspan font-family="Consolas" fill="#0F766E">04</tspan> ASSEMBLE — 编码为本轮输入</text>
    </g>
    <text x="578" y="552" font-size="14" fill="#6B7280" text-anchor="middle">每次模型调用运行一次,不是持久记忆</text>
    <line x1="762" y1="405" x2="822" y2="405" stroke="#0F766E" stroke-width="3" marker-end="url(#arrowTeal)"/>
  </g>

  <g id="model-context-out" data-pptx-bounds="826 150 394 480">
    <text x="826" y="176" font-size="14" font-weight="bold" fill="#0F766E" letter-spacing="1">MODEL-VISIBLE CONTEXT</text>
    <rect x="826" y="196" width="394" height="240" rx="8" fill="#1E2A32"/>
    <text x="850" y="236" font-size="14" font-weight="bold" fill="#6FD5C4" letter-spacing="1">本轮推理的工作集</text>
    <rect x="850" y="262" width="8" height="8" fill="#6FD5C4"/>
    <text x="872" y="272" font-size="16" fill="#E8E4D9">系统指令与安全策略</text>
    <rect x="850" y="302" width="8" height="8" fill="#6FD5C4"/>
    <text x="872" y="312" font-size="16" fill="#E8E4D9">当前任务状态与目标</text>
    <rect x="850" y="342" width="8" height="8" fill="#6FD5C4"/>
    <text x="872" y="352" font-size="16" fill="#E8E4D9">相关证据与必要历史</text>
    <text x="850" y="408" font-size="14" fill="#8FA0AC">随任务阶段变化 · 每轮重新编译</text>
    <text x="826" y="474" font-size="18" fill="#6B7280">不是全部历史,也不是最大填充</text>
  </g>

  <g id="page-footer" data-pptx-bounds="1120 668 100 32">
    <text x="1220" y="690" font-size="14" fill="#98A1AB" text-anchor="end">03 / 13</text>
