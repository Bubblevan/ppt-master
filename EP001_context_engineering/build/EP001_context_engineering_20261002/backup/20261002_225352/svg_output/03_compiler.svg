    <line x1="282" y1="322" x2="308" y2="322" stroke="#B9C0C8" stroke-width="1.5"/>
    <line x1="282" y1="374" x2="308" y2="374" stroke="#B9C0C8" stroke-width="1.5"/>
    <line x1="282" y1="426" x2="308" y2="426" stroke="#B9C0C8" stroke-width="1.5"/>
    <line x1="282" y1="478" x2="308" y2="478" stroke="#B9C0C8" stroke-width="1.5"/>
    <line x1="282" y1="530" x2="308" y2="530" stroke="#B9C0C8" stroke-width="1.5"/>
    <line x1="282" y1="582" x2="308" y2="582" stroke="#B9C0C8" stroke-width="1.5"/>
