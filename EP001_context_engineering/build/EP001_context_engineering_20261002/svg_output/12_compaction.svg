    <text x="156" y="466" font-size="14" font-weight="bold" fill="#6B7280" text-anchor="middle">Long History</text>
    <text x="473" y="466" font-size="14" font-weight="bold" fill="#6B7280" text-anchor="middle">COMPRESSION · 压缩</text>
  </g>

  <g id="core-points" data-pptx-bounds="760 148 460 260">
    <rect x="760" y="152" width="460" height="56" rx="6" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1"/>
    <text x="780" y="187" font-size="15" fill="#1A1D1F"><tspan font-weight="bold">控制增长</tspan> — 压缩用于控制历史的持续增长</text>
    <rect x="760" y="216" width="460" height="56" rx="6" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1"/>
    <text x="780" y="251" font-size="15" fill="#1A1D1F"><tspan font-weight="bold">本身有损</tspan> — 摘要可能丢失关键事实与限定条件</text>
    <rect x="760" y="280" width="460" height="56" rx="6" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1"/>
    <text x="780" y="315" font-size="15" fill="#1A1D1F"><tspan font-weight="bold">不承担权威</tspan> — 权限与关键约束不能只靠未验证摘要维持</text>
    <rect x="760" y="344" width="460" height="56" rx="6" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1"/>
    <text x="780" y="379" font-size="15" fill="#1A1D1F"><tspan font-weight="bold">只是机制之一</tspan> — Compaction ≠ Context Engineering</text>
  </g>

  <g id="compaction-chain" data-pptx-bounds="60 486 1160 110">
